<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>الأخوين | للملابس</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #11100f;
            color: #eee;
        }

        header {
            background: #0a0908;
            padding: 25px 15px;
            text-align: center;
            border-bottom: 1px solid #5c4a2d;
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            color: #c7a96b;
            margin: 0;
        }

        .subtitle {
            color: #aaa;
            margin-top: 8px;
        }

        .hero {
            text-align: center;
            padding: 55px 20px;
            background: linear-gradient(#151311, #0d0c0b);
        }

        .hero h1 {
            font-size: 34px;
            color: #c7a96b;
            margin-bottom: 10px;
        }

        .hero p {
            color: #bbb;
        }

        .categories {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 20px 10px;
            flex-wrap: wrap;
        }

        .category {
            background: #1b1917;
            color: #c7a96b;
            border: 1px solid #5c4a2d;
            padding: 12px 20px;
            border-radius: 6px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            padding: 20px;
        }

        .product {
            background: #1b1917;
            border: 1px solid #302a22;
            border-radius: 10px;
            padding: 12px;
            text-align: center;
        }

        .product img {
            width: 100%;
            height: 190px;
            object-fit: cover;
            border-radius: 7px;
        }

        .product h3 {
            color: #eee;
        }

        .price {
            color: #c7a96b;
            font-size: 18px;
            font-weight: bold;
        }

        .buy {
            background: #c7a96b;
            color: #111;
            border: none;
            padding: 11px 25px;
            border-radius: 6px;
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #777;
            border-top: 1px solid #302a22;
        }
    </style>
</head>

<body>

<header>
    <h1 class="logo">الأخوين</h1>
    <div class="subtitle">للملابس الرجالية والنسائية والولادية</div>
</header>

<section class="hero">
    <h1>مرحباً بكم في الأخوين</h1>
    <p>أناقة تليق بك</p>
</section>

<div class="categories">
    <div class="category">رجالي</div>
    <div class="category">نسائي</div>
    <div class="category">ولادي</div>
</div>

<section class="products">

    <div class="product">
        <img src="https://via.placeholder.com/400x500" alt="ملابس رجالية">
        <h3>منتج رجالي</h3>
        <p class="price">150 ريال سعودي</p>
        <button class="buy">شراء</button>
    </div>

    <div class="product">
        <img src="https://via.placeholder.com/400x500" alt="ملابس نسائية">
        <h3>منتج نسائي</h3>
        <p class="price">180 ريال سعودي</p>
        <button class="buy">شراء</button>
    </div>

    <div class="product">
        <img src="https://via.placeholder.com/400x500" alt="ملابس ولادية">
        <h3>منتج ولادي</h3>
        <p class="price">100 ريال سعودي</p>
        <button class="buy">شراء</button>
    </div>

</section>

<footer>
    © 2026 متجر الأخوين
</footer>

</body>
</html>
